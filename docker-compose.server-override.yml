# SignalKit — shared-server override
#
# Use when deploying to a server that already runs its own reverse proxy
# (e.g. a host-level Caddy serving other services on :80/:443).
#
# What this does:
#   • Exposes the API on 127.0.0.1:4000 so the host proxy can reach it
#   • Disables the bundled `caddy` container (would conflict on :80/:443)
#   • Disables the `web` container (API-only deployment for mobile APK)
#
# Usage:
#   docker compose \
#     -f docker-compose.production.yml \
#     -f docker-compose.server-override.yml \
#     --env-file .env.production \
#     up -d
#
# The host Caddy config should proxy api.YOUR_DOMAIN to http://127.0.0.1:4000

services:
  api:
    ports:
      - "127.0.0.1:4000:4000"

  # Disable the bundled Caddy — the host reverse proxy handles TLS.
  caddy:
    profiles:
      - caddy-disabled

  # Disable the web container — not needed for mobile APK acceptance.
  web:
    profiles:
      - web-disabled
