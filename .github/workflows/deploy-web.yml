name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
      - session-15-mobile-premium-app
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @signalkit/config build
          pnpm --filter @signalkit/shared build
          pnpm --filter @signalkit/i18n build
          pnpm --filter @signalkit/ui build

      - name: Build web (static export)
        env:
          NEXT_BUILD_MODE: export
          NEXT_PUBLIC_API_URL: https://api.178-105-237-128.sslip.io
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @signalkit/web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
