name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm exec tsc -b

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Builds the production API image exactly as a deploy does and proves it runs:
  # migrations as a release step, then the API container answering /health.
  api-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalkit
          POSTGRES_PASSWORD: signalkit
          POSTGRES_DB: signalkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalkit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # Throwaway CI-only values; the container reaches the service ports via
      # the host gateway. No real secret is used or baked into the image.
      DATABASE_URL: postgresql://signalkit:signalkit@host.docker.internal:5432/signalkit
      REDIS_URL: redis://host.docker.internal:6379
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f infra/docker/Dockerfile.api -t signalkit-api:ci .

      - name: Run migrations (release step)
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL signalkit-api:ci \
            node_modules/.bin/prisma migrate deploy --schema ./prisma/schema.prisma

      - name: Start API container
        run: |
          docker run -d --name signalkit-api -p 4000:4000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL -e REDIS_URL \
            -e JWT_SECRET=ci-only-jwt-secret \
            -e ENCRYPTION_KEY_FOR_LLM_KEYS=ci-only-encryption-key-32-bytes!! \
            -e CORS_ORIGINS=http://localhost:3000 \
            signalkit-api:ci

      - name: GET /health
        run: |
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:4000/health); then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs signalkit-api || true
